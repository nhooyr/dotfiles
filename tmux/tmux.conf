set-option -g history-limit 99999
set-option -g mode-keys vi
set-option -g mouse off
set-option -g focus-events on

unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind-key C-q kill-session

bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

bind-key r source-file ~/.tmux.conf

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy

set-option -g message-style "fg=white bg=blue"
set-option -g mode-style "fg=white bg=black"
set-option -g pane-border-style "fg=black"
set-option -g pane-active-border-style "fg=black"
set-option -g status-style "fg=white bg=black"
set-option -g window-status-bell-style "reverse bold italics underscore"
set-option -g window-status-current-style "italics underscore"

set-option -g tree-mode-border-style "fg=black bold"
set-option -g tree-mode-preview-style "fg=black underscore italics"
set-option -g tree-mode-selection-style "fg=black underscore italics"
set-option -g light-theme-light-grey "brightblack"
