name: github.fish

on:
  push:
    paths:
      - 'fish/github.fish'
      - 'fish/github-tests/*'
      - 'ci/github-test.sh'
  pull_request:
    paths:
      - 'fish/github.fish'
      - 'fish/github-tests/*'
      - 'ci/github-test.sh'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./ci/github-test.sh
